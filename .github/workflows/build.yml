name: Build Windows GUI

on:
  push:
    branches: [ main, variant-8-shell-emulator ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build .\ShellEmulator\ShellEmulator.csproj --configuration Release
