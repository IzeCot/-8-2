name: Build and test NuGet dependency visualizer
on:
  push:
    branches: [main, nuget-dependency-visualizer]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and run offline test cases
        shell: pwsh
        run: ./tests/run-tests.ps1
